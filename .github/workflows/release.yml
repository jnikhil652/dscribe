name: Release DMG
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build DMG
        run: VERSION="${GITHUB_REF_NAME#v}" ./make-dmg.sh
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: Mumble.dmg
          generate_release_notes: true
