name: Release DMG
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import signing certificate
        # Optional: secrets SIGNING_CERT_P12 (base64 .p12) + SIGNING_CERT_PASSWORD, made by scripts/make-signing-cert.sh.
        # A stable identity keeps Accessibility/Microphone permissions across auto-updates.
        env:
          P12: ${{ secrets.SIGNING_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        if: env.P12 != ''
        run: |
          KC="$RUNNER_TEMP/sign.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "SIGN_IDENTITY=DScribe Self-Signed" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"
      - name: Build DMG
        run: VERSION="${GITHUB_REF_NAME#v}" ./make-dmg.sh
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: DScribe.dmg
          generate_release_notes: true
